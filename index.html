    <body
        class="tw-flex tw-min-h-[100vh] tw-flex-col tw-text-base tw-font-sans"
        style="background: var(--background-color); color: var(--primary-text-color);"
    >

        <div class="tw-flex tw-w-full" id="main-flex-container" style="background: var(--background-color); min-height: 100vh;">
            <section
                class="tw-relative tw-bg-secondary tw-text-textColor tw-flex tw-w-full tw-flex-col sidebar-section"
                style="background: var(--sidebar-bg); color: var(--sidebar-text);"
            >


                <div class="tw-w-full tw-gap-2 tw-flex tw-p-4 sidebar-header-wrap">
                    <div class="page-link brand-link tw-flex tw-flex-gap-1">
                        <div class="">Ananya's Portfolio</div>
                        <i class="bi bi-chevron-down tw-text-sm"></i>
                    </div>

                    <button onclick="openSearch()" class="page-link tw-text-base tw-flex tw-flex-gap-1">
                        <i class="bi bi-search"></i>
                        <div class="">Search</div>
                    </button>

                    <button onclick="loadPage('/about')" class="page-link tw-text-base tw-flex tw-flex-gap-1" id="home-quick-link">
                        <i class="bi bi-house"></i>
                        <div class="">Home</div>
                    </button>

                    <button id="dark-mode-toggle" class="btn theme-toggle" title="Toggle dark mode" aria-label="Enable dark mode">
                        <i class="bi bi-moon"></i>
                        <span class="theme-toggle-label">Dark</span>
                    </button>
                </div>

                <div
                    class="tw-flex tw-px-4 tw-p-1 tw tw-w-full tw-gap-1"
                    id="sidebar-content"
                >   
                    
                </div>
            </section>

            <section
                class="tw-relative tw-flex tw-w-full tw-max-w-[100vw] tw-flex-col main-content-section"
                style="background: var(--section-bg); color: var(--primary-text-color);"
            >   

                <div class="tw-overflow-auto tw-min-h-[30vh] tw-h-full tw-px-[25%] tw-w-full">
                    <div class="tw-w-full tw-flex tw-mt-[140px]">
                        <div class="tw-w-[85px] tw-h-[85px] tw-flex tw-place-content-center tw-items-center tw-text-6xl tw-overflow-hidden tw-text-6xl tw-rounded-lg" id="content-icon">

                        </div>
                    </div>
                    <div
                        class="tw-mt-8 tw-gap-10 content tw-pb-[30vh]" id="content"
                    >
                        
                    </div>
                </div>
            </section>
        
        </div>

        <div class="tw-fixed tw-hidden tw-z-10 tw-top-0 tw-flex tw-w-full tw-h-full tw-bg-[#2f2f2fb3]" id="search-bg-container">

            <div class="tw-relative tw-flex tw-w-full tw-h-full ">
                <div id="search-container" class="tw-absolute tw-overflow-hidden tw-left-[50%] tw--translate-x-[50%] tw-top-24 tw-w-[750px] tw-h-[500px] tw-rounded-xl" style="background: var(--section-bg); color: var(--primary-text-color);">

                    <div class="tw-flex tw-px-4 tw-p-2 tw-text-lg tw-w-full tw-place-items-center tw-gap-2">
                        <i class="bi bi-search"></i>
                        <input type="text" oninput="updateSearch(event)" class="tw-w-full input" autofocus placeholder="Search" id="search-input">
                    </div>

                    <div class="tw-w-full tw-h-[2px] tw-bg-[#ededec]"></div>

                    <div class="tw-flex tw-flex-col tw-p-2 tw-text-textColor tw-h-[400px]  tw-overflow-y-auto">

                        <div class="tw-text-[12px] tw-text-[#93928f]">

                        </div>

                            <div class="tw-flex tw-rounded-md tw-p-2 tw-px-3 tw-w-full hover:tw-bg-[#f1f0ef]">
                                edwed
                            </div>

                    </div>
                    <div class="tw-w-full tw-h-[2px] tw-bg-[#ededec]"></div>

                    <div class="tw-w-full tw-h-[30px]">

                    </div>
